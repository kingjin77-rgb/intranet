<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>문서 · 사내 인트라넷</title>
<meta property="og:title" content="[사내 인트라넷] 문서 확인 요청">
<meta property="og:description" content="눌러서 문서를 확인하고 의견·컨펌를 남겨주세요.">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a4f8a">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인트라넷">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=6.3.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js?v=6.3.0"></script>
<script src="app.js?v=6.3.0"></script>
<script src="video.js?v=6.3.0"></script>
<script src="viewer.js?v=6.3.0"></script>
<script src="diff.js?v=6.3.0"></script>
</head>
<body>
<main class="container">
  <div id="newBanner" class="card" hidden style="background:var(--soft)">
    ✅ 등록되었습니다. <b>카톡 공유용 링크 복사</b>를 눌러 카톡방에 붙여넣으세요.
  </div>

  <div class="card">
    <div style="display:flex;gap:8px;align-items:flex-start;flex-wrap:wrap">
      <div style="flex:1;min-width:0">
        <div class="page-title" id="title">불러오는 중…</div>
        <p class="muted" id="meta"></p>
        <p class="muted" id="caseLink" hidden></p>
      </div>
      <span id="status"></span>
    </div>
    <p id="desc" style="margin-top:10px;white-space:pre-wrap;overflow-wrap:anywhere"></p>
    <div class="btn-row">
      <button class="btn" id="shareBtn">🔗 카톡 공유용 링크 복사</button>
      <a class="btn ghost" id="openBtn" target="_blank" rel="noopener">새 창에서 열기</a>
      <a class="btn ghost" id="downloadBtn">다운로드</a>
      <a class="btn ghost" id="resubmitBtn" hidden>📝 수정본 올리기</a>
      <button class="btn ghost" id="deleteBtn" hidden style="color:var(--bad)">삭제</button>
    </div>
    <div class="notice" id="rejectedNotice" hidden></div>
  </div>

  <div class="detail-grid">
    <div>
      <div class="card" id="viewerCard"><div class="tabs file-tabs" id="fileTabs" hidden></div><div id="viewerBody"></div></div>

      <div class="card" id="commentsCard">
        <h2>💬 코멘트 <span class="count" id="commentCount"></span></h2>
        <div class="comments" id="comments"></div>
        <form class="xc-form" id="commentForm">
          <span id="myAvatar"></span>
          <div class="xc-compose">
            <textarea id="commentBody" placeholder="의견을 남겨주세요" maxlength="2000" rows="2"></textarea>
            <div class="xc-files" id="pendingFiles"></div>
            <div class="xc-tools">
              <label class="xc-tool" id="attachBtn" title="파일·사진 첨부 (5개까지)">📎<input type="file" id="commentFiles" multiple hidden></label>
              <button type="button" class="xc-tool" id="emojiBtn" title="이모지">😊</button>
              <button type="button" class="xc-tool xc-timebtn" id="timeBtn" title="지금 보는 영상 장면을 코멘트에 넣기" hidden>⏱ 0:00</button>
              <input type="text" class="xc-page" id="pageNo" inputmode="numeric" placeholder="쪽" title="해당 페이지 (선택)">
              <span class="xc-hint" id="dropHint">사진은 붙여넣기(Ctrl+V)·끌어다 놓기도 돼요</span>
              <button class="xc-post" type="submit" id="postBtn">게시</button>
            </div>
            <div class="xc-emoji" id="emojiPanel" hidden></div>
          </div>
        </form>
      </div>
    </div>

    <div>
      <div class="card" id="versionsCard" hidden>
        <h2>🗂 버전</h2>
        <ul class="people" id="versions"></ul>
      </div>
      <div class="card" id="approvalCard" hidden>
        <h2>✍️ 컨펌 <span class="count" id="approvalProgress"></span></h2>
        <div class="due-row" id="dueRow" hidden>
          <span id="dueText"></span>
          <input type="date" id="dueInput" hidden title="컨펌 기한">
          <button class="btn ghost sm" type="button" id="nudgeApprovers" hidden>🔔 컨펌 요청 다시 보내기</button>
        </div>
        <p class="muted" id="noApprovers" hidden>컨펌자가 지정되지 않은 문서입니다.</p>
        <ul class="steps" id="steps"></ul>
        <div id="addApproverBox" hidden>
          <button class="btn ghost sm" type="button" id="addApproverBtn">＋ 컨펌 요청</button>
          <div class="approver-pick" id="approverPick" hidden>
            <div class="pick-list" id="pickList"></div>
            <div class="btn-row">
              <button class="btn sm" type="button" id="pickSend" style="flex:1">요청 보내기</button>
              <button class="btn ghost sm" type="button" id="pickCancel">취소</button>
            </div>
          </div>
        </div>
        <form id="actForm" hidden>
          <textarea id="actComment" placeholder="컨펌 의견 (반려 시 필수)" maxlength="1000"></textarea>
          <div class="btn-row">
            <button class="btn ok" type="button" data-decision="approved" style="flex:1">컨펌</button>
            <button class="btn bad" type="button" data-decision="rejected" style="flex:1">반려</button>
          </div>
        </form>
      </div>

      <div class="card" id="diffCard" hidden>
        <h2>🔍 바뀐 곳</h2>
        <p class="muted df-summary" id="diffSummary"></p>
        <ul class="mk-list" id="diffList"></ul>
      </div>

      <div class="card" id="markupCard" hidden>
        <h2>🖍 첨삭 <span class="count" id="markupCount"></span></h2>
        <div class="mk-filter" id="markupFilter"></div>
        <ul class="mk-list" id="markupList"></ul>
      </div>

      <div class="card" id="viewsCard">
        <h2>👀 열람 현황 <span class="count" id="viewCount"></span></h2>
        <div class="progress"><div id="viewBar" style="width:0"></div></div>
        <ul class="people" id="seen"></ul>
        <div id="unseenWrap" hidden>
          <p class="muted" style="margin:14px 0 6px">아직 안 본 사람</p>
          <ul class="people unseen" id="unseen"></ul>
          <div class="btn-row"><button class="btn sm" id="nudgeUnseen" hidden>🔔 안 본 사람에게 알림 보내기</button><button class="btn ghost sm" id="nudgeBtn">독촉 문구 복사(카톡용)</button></div>
        </div>
      </div>
    </div>
  </div>
</main>
<script>
(async () => {
  const { sb, esc, fmtDate, fmtSize, statusBadge, toast, errMsg, copyText, fileIcon } = App;
  const me = await App.requireAuth();
  const params = new URLSearchParams(location.search);
  const docId = params.get('id');
  const docUrl = App.pageUrl('doc.html', { id: docId });
  if (params.get('new')) {
    document.getElementById('newBanner').hidden = false;
    history.replaceState(null, '', `doc.html?id=${encodeURIComponent(docId)}`);
  }

  const { data: doc, error } = await sb.from('documents').select('*').eq('id', docId).maybeSingle();
  if (error || !doc) {
    document.querySelector('main').innerHTML = '<div class="card"><h2>문서를 찾을 수 없습니다</h2><p class="muted">삭제되었거나 잘못된 링크입니다.</p><div class="btn-row"><a class="btn" href="index.html">문서함으로</a></div></div>';
    return;
  }
  document.title = `${doc.title} · 사내 인트라넷`;

  await sb.rpc('record_view', { p_doc_id: docId });

  const members = await App.loadMembers();
  const { data: uploader } = await sb.from('profiles').select('*').eq('id', doc.uploader_id).maybeSingle();
  const nameOf = {};
  members.forEach(m => (nameOf[m.id] = m.name));
  if (uploader) { nameOf[uploader.id] = uploader.name; if (!App.people[uploader.id]) App.remember([uploader]); }

  // ----- 문서 정보 + 뷰어 -----
  document.getElementById('title').textContent = doc.title;
  document.getElementById('meta').textContent = doc.kind === 'form'
    ? `${nameOf[doc.uploader_id] || ''} · ${fmtDate(doc.created_at)} · 📝 ${(doc.form && doc.form.type) || '양식'}${doc.version > 1 ? ` · v${doc.version}` : ''}`
    : `${nameOf[doc.uploader_id] || ''} · ${fmtDate(doc.created_at)} · ${doc.file_name} ${fmtSize(doc.file_size)}${doc.version > 1 ? ` · v${doc.version}` : ''}`;
  document.getElementById('desc').textContent = doc.description || '';

  const openBtn = document.getElementById('openBtn');
  const viewer = document.getElementById('viewerBody');
  // 파일이 여러 개면 위에 탭을 두고, 누른 파일을 미리보기한다
  const allFiles = doc.kind === 'form' ? [] : [
    { path: doc.file_path, name: doc.file_name, type: doc.file_type, size: doc.file_size },
    ...(Array.isArray(doc.extra_files) ? doc.extra_files : []),
  ];
  if (allFiles.length > 1) {
    const tabs = document.getElementById('fileTabs');
    tabs.hidden = false;
    tabs.innerHTML = allFiles.map((f, i) => `<button class="tab${i ? '' : ' active'}" data-i="${i}" title="${esc(f.name)}">${fileIcon(f.type, f.name)} ${esc(f.name)}</button>`).join('');
    tabs.onclick = (e) => {
      const b = e.target.closest('.tab');
      if (!b || b.classList.contains('active')) return;
      tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
      openBtn.hidden = false;
      renderFile(allFiles[+b.dataset.i]).catch(e => console.warn(e));
    };
    document.getElementById('meta').textContent += ` 외 ${allFiles.length - 1}개`;
  }
  // 첨삭·전체화면 뷰어 (viewer.js). 이전 버전 첨삭도 겹쳐 볼 수 있게 직전 버전 id 를 넘긴다
  const [hasV6, prevDoc] = await Promise.all([
    App.hasV6(),
    doc.group_id && doc.version > 1
      ? sb.from('documents').select('id,version,kind,file_path,file_name,file_type').eq('group_id', doc.group_id).eq('version', doc.version - 1).maybeSingle().then(r => r.data, () => null)
      : null,
  ]);
  Viewer.init({
    doc, me, nameOf, hasV6, prevDocId: prevDoc && prevDoc.id,
    avatar: (uid, size) => avatar(uid, size),
    onChange: () => renderMarkupList(),
    switchFile: async (path) => {
      const i = allFiles.findIndex(f => f.path === path);
      const b = document.querySelector(`#fileTabs .tab[data-i="${i}"]`);
      if (b && !b.classList.contains('active')) { b.click(); await new Promise(r => setTimeout(r, 900)); }
    },
  });
  // 수정본이면 이전 버전 대표 파일과 글자 비교 (diff.js)
  DocDiff.init({
    doc, me, nameOf, hasV6, primaryPath: doc.file_path,
    primary: { name: doc.file_name, type: doc.file_type },
    prev: prevDoc && prevDoc.kind !== 'form' && prevDoc.file_path
      ? { path: prevDoc.file_path, name: prevDoc.file_name, type: prevDoc.file_type, version: prevDoc.version } : null,
  });
  if (doc.kind === 'form') { Viewer.plain(''); renderFormDoc(); } else await renderFile(allFiles[0]);

  // 양식(기안서·지급품의서·출장신청서)은 파일 대신 내용 카드로 보여준다
  function renderFormDoc() {
    openBtn.hidden = true;
    document.getElementById('downloadBtn').hidden = true;
    const f = doc.form || {};
    const rows = [['양식', f.type]];
    if (f.type === '지급품의서') rows.push(['금액', f.amount && App.fmtWon(f.amount)], ['지급처', f.payee], ['지급 예정일', f.pay_date]);
    if (f.type === '출장신청서') rows.push(['출장지', f.place], ['기간', [f.from, f.to].filter(Boolean).join(' ~ ')], ['예상 경비', f.amount && App.fmtWon(f.amount)]);
    viewer.innerHTML = `<div class="form-doc">
      <div class="form-doc-title">${esc(f.type || '양식')}</div>
      <table class="kv">${rows.filter(r => r[1]).map(r => `<tr><th>${esc(r[0])}</th><td>${esc(r[1])}</td></tr>`).join('')}</table>
      <div class="form-doc-body">${esc(f.content || '')}</div>
    </div>`;
  }

  async function renderFile(file) {
    const f = file;
    const [view, dl] = await Promise.all([
      sb.storage.from('docs').createSignedUrl(f.path, 3600),
      sb.storage.from('docs').createSignedUrl(f.path, 3600, { download: f.name }),
    ]);
    const viewUrl = view.data && view.data.signedUrl;
    openBtn.href = viewUrl || '#';
    document.getElementById('downloadBtn').href = (dl.data && dl.data.signedUrl) || '#';
    document.getElementById('downloadBtn').onclick = () => App.logActivity('download', 'documents', doc.id, f.name);

    const lower = f.name.toLowerCase();
    const noPreview = (msg) => {
      Viewer.plain(f.path);
      openBtn.hidden = true;
      viewer.innerHTML = `<div class="file-box"><span class="icon">${fileIcon(f.type, f.name)}</span>
        <div><div class="name">${esc(f.name)}</div>
        <p class="muted">${msg} 위의 <b>다운로드</b>를 눌러 확인하세요. (PDF로 올리면 바로 볼 수 있어요)</p></div></div>`;
    };
    if (viewUrl && (f.type === 'application/pdf' || lower.endsWith('.pdf'))) {
      // pdf.js 로 직접 그려야 그 위에 첨삭을 겹칠 수 있다. 실패하면 브라우저 기본 뷰어로
      viewer.innerHTML = '<p class="muted">PDF 불러오는 중…</p>';
      try {
        await Viewer.pdf(viewUrl, f.path);
      } catch (e) {
        console.warn('pdf.js 실패, 기본 뷰어로', e);
        Viewer.plain(f.path);
        viewer.innerHTML = `<iframe class="viewer" src="${esc(viewUrl)}" title="${esc(f.name)}"></iframe>
          <p class="muted" style="margin-top:6px">휴대폰에서 안 보이면 위의 <b>새 창에서 열기</b>를 누르세요.</p>`;
      }
    } else if (viewUrl && (f.type || '').startsWith('image/')) {
      Viewer.image(viewUrl, f.name, f.path);
    } else if (viewUrl && App.isVideo(f)) {
      openBtn.hidden = true;
      Viewer.video(viewUrl, f.name, f.path, () => noPreview('이 브라우저에서 재생할 수 없는 영상 형식입니다.'));
    } else if (viewUrl && /\.(docx|xlsx)$/.test(lower)) {
      // 워드·엑셀은 이 브라우저 안에서 직접 그린다 (파일이 외부 서버로 나가지 않음)
      openBtn.hidden = true;
      Viewer.plain(f.path);
      viewer.innerHTML = '<p class="muted">미리보기 준비 중…</p>';
      renderOffice(lower.endsWith('.docx') ? 'docx' : 'xlsx', viewUrl).catch((e) => {
        console.warn(e);
        noPreview('미리보기를 만들지 못했습니다.');
      });
    } else {
      noPreview('이 형식은 미리보기가 안 됩니다.');
    }

    async function renderOffice(kind, url) {
      const CDN = 'https://cdn.jsdelivr.net/npm/';
      const res = await fetch(url);
      if (!res.ok) throw new Error('파일을 받지 못했습니다');
      const data = await res.arrayBuffer();
      if (kind === 'docx') {
        await App.loadScript(CDN + 'jszip@3.10.2/dist/jszip.min.js');
        await App.loadScript(CDN + 'docx-preview@0.4.1/dist/docx-preview.min.js');
        viewer.innerHTML = '<div class="office-view docx-view"></div>';
        const box = viewer.querySelector('.docx-view');
        let z = 1;
        await window.docx.renderAsync(data, box, null, { inWrapper: true, ignoreLastRenderedPageBreak: true });
        // A4 페이지가 상자보다 넓으면 상자 폭에 맞춰 줄인다 (휴대폰 포함)
        const fit = () => {
          const wrap = box.querySelector('.docx-wrapper'), page = box.querySelector('section.docx');
          if (!wrap || !page) return;
          // 폭에 맞춘 크기(1) 기준으로 뷰어 툴바의 확대·축소 배율을 곱한다
          wrap.style.zoom = '';
          wrap.style.zoom = Math.min(1, (box.clientWidth - 8) / (page.offsetWidth + 24)) * z;
        };
        fit();
        window.addEventListener('resize', () => fit());
        Viewer.docxPages(box, (nz) => { z = nz; fit(); }, f.path);
        return;
      }
      await App.loadScript(CDN + 'exceljs@4.4.0/dist/exceljs.min.js');
      const wb = new window.ExcelJS.Workbook();
      await wb.xlsx.load(data);
      const sheets = wb.worksheets.filter(ws => ws.state !== 'hidden' && ws.state !== 'veryHidden');
      if (!sheets.length) throw new Error('빈 통합문서');
      const MAX_ROWS = 500, MAX_COLS = 50;
      const table = (ws) => {
        const rows = Math.min(ws.rowCount, MAX_ROWS), cols = Math.min(ws.columnCount, MAX_COLS);
        let html = '<table class="sheet"><tbody>';
        for (let r = 1; r <= rows; r++) {
          const row = ws.getRow(r);
          html += '<tr><th>' + r + '</th>';
          for (let c = 1; c <= cols; c++) {
            const cell = row.getCell(c);
            // 병합된 칸은 첫 칸에만 값을 보여준다
            let text = cell.isMerged && cell.master !== cell ? '' : cell.text;
            if (!text && cell.formula) text = '=' + cell.formula;  // 계산값이 저장 안 된 수식
            html += `<td>${esc(text)}</td>`;
          }
          html += '</tr>';
        }
        html += '</tbody></table>';
        if (ws.rowCount > MAX_ROWS || ws.columnCount > MAX_COLS) {
          html += `<p class="muted" style="margin-top:6px">앞부분(${MAX_ROWS}행·${MAX_COLS}열)만 보여줍니다. 전체는 다운로드해서 보세요.</p>`;
        }
        return html;
      };
      viewer.innerHTML = `${sheets.length > 1 ? `<div class="tabs sheet-tabs">${sheets.map((ws, i) =>
          `<button class="tab${i ? '' : ' active'}" data-i="${i}">${esc(ws.name)}</button>`).join('')}</div>` : ''}
        <div class="office-view sheet-view">${table(sheets[0])}</div>`;
      const tabs = viewer.querySelector('.sheet-tabs');
      if (tabs) tabs.onclick = (e) => {
        const b = e.target.closest('.tab');
        if (!b) return;
        tabs.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
        viewer.querySelector('.sheet-view').innerHTML = table(sheets[+b.dataset.i]);
      };
    }

  }

  if (doc.uploader_id === me.id || me.role === 'admin') {
    const del = document.getElementById('deleteBtn');
    del.hidden = false;
    del.onclick = async () => {
      if (!confirm('이 문서와 코멘트·컨펌 기록을 모두 삭제할까요?')) return;
      const paths = [doc.file_path, ...(doc.extra_files || []).map(f => f.path)].filter(Boolean);
      if (paths.length) await sb.storage.from('docs').remove(paths);
      const { error } = await sb.from('documents').delete().eq('id', docId);
      if (error) return toast(errMsg(error), true);
      location.replace('index.html');
    };
  }

  // ----- 컨펌 -----
  let steps = [];
  async function loadSteps() {
    const [s, d] = await Promise.all([
      sb.from('approval_steps').select('*').eq('doc_id', docId).order('step_order'),
      sb.from('documents').select('status').eq('id', docId).maybeSingle(),
    ]);
    steps = s.data || [];
    doc.status = (d.data && d.data.status) || doc.status;
    document.getElementById('status').innerHTML = statusBadge(doc.status);
    const card = document.getElementById('approvalCard');
    // 컨펌자 없이 올린 문서도 칸을 보여주고, 올린 사람·관리자가 나중에 요청할 수 있게 한다
    const canAdd = (doc.uploader_id === me.id || me.role === 'admin') && ['none', 'pending', 'rejected'].includes(doc.status);
    card.hidden = !steps.length && !canAdd;
    document.getElementById('noApprovers').hidden = !!steps.length;
    document.getElementById('addApproverBox').hidden = !canAdd;
    document.getElementById('addApproverBtn').textContent = steps.length ? '＋ 컨펌자 추가' : '＋ 컨펌 요청';
    const label = { waiting: '대기', current: '컨펌 차례', approved: '컨펌', rejected: '반려', skipped: '—' };
    document.getElementById('steps').innerHTML = steps.map(st => `
      <li class="${st.state}">
        <span class="dot"></span>
        <div class="who">${avatar(st.approver_id, 22)} ${esc(nameOf[st.approver_id] || '(퇴사자)')}${st.approver_id === me.id ? ' (나)' : ''}</div>
        <div class="note">${label[st.state]}${st.acted_at ? ' · ' + fmtDate(st.acted_at) : ''}</div>

      </li>`).join('');

  // ----- 컨펌 기한 · 다시 알림 (v5) -----
  const owner = doc.uploader_id === me.id || me.role === 'admin';
  function dday(due) {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const n = Math.round((new Date(due + 'T00:00:00') - t) / 86400000);
    return n < 0 ? `<b class="due-late">기한 ${-n}일 지남</b>` : n === 0 ? '<b class="due-soon">오늘까지</b>' : `D-${n}`;
  }
  function renderDue() {
    const v5 = 'due_date' in doc;
    const row = document.getElementById('dueRow');
    row.hidden = !v5 || (!doc.due_date && !(owner && doc.status === 'pending'));
    if (row.hidden) return;
    document.getElementById('dueText').innerHTML = doc.due_date
      ? `⏰ 컨펌 기한 ${doc.due_date.slice(5).replace('-', '/')} (${dday(doc.due_date)})` : '⏰ 기한 없음';
    const inp = document.getElementById('dueInput');
    inp.hidden = !(owner && ['pending', 'none'].includes(doc.status));

  async function nudge(kind, btn) {

  document.getElementById('nudgeUnseen').onclick = (e) => nudge('unseen', e.target);

  const pick = document.getElementById('approverPick');
  document.getElementById('addApproverBtn').onclick = () => {

  // ----- 열람 현황 -----

  // ----- 코멘트 (X 스타일: 첨부파일 · 이모지 · 반응) -----
  const REACTIONS = ['❤️', '👍', '😂', '😮', '🙏', '🔥', '👀', '✅'];
  const EMOJIS = '😀 😂 🤣 😊 😍 🥰 😎 🤔 😅 😭 😡 😱 🥲 🙄 😴 🤝 👍 👎 👏 🙏 💪 👌 ✌️ 🙌 🔥 💯 ✅ ❌ ⚠️ ❗ ❓ 💡 📌 📎 📅 ⏰ 💰 📄 ⚖️ 🎉 ❤️ 💙 👀 ✍️ 🚀 ☕'.split(' ');
  const MAX_FILES = 5, MAX_FILE = 50 * 1024 * 1024;
  // 005 SQL 을 실행하기 전이면 첨부·반응은 숨기고 이모지 넣기만 쓴다
  // HEAD 요청은 테이블이 없어도 오류가 안 잡히는 경우가 있어 GET 으로 확인한다
  const hasV33 = sb.from('comment_reactions').select('comment_id').limit(1)
    .then(r => !r.error && Array.isArray(r.data), () => false);
  let reactT, pending = [], groupDocs = null, showResolved = false;

  // 사진·캐릭터 아바타 (app.js). 퇴사자 등 목록에 없는 사람은 이름 첫 글자
  function avatar(uid, size = 38) {
    return App.avatar(App.people[uid] || { id: uid, name: nameOf[uid] || '?' }, size, 'xc-avatar');
  }
  function ago(iso) {
    const s = (Date.now() - new Date(iso)) / 1000;
    if (s < 60) return '방금';
    if (s < 3600) return `${Math.floor(s / 60)}분`;
    if (s < 86400) return `${Math.floor(s / 3600)}시간`;
    if (s < 7 * 86400) return `${Math.floor(s / 86400)}일`;
    return fmtDate(iso).split(' ')[0];
  }
  // 글자는 모두 escape 한 뒤 링크와 @이름만 꾸민다
  function fmtBody(t) {
    return esc(t)
      .replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">$1</a>')
      .replace(/(^|\s)@([^\s@<]{1,20})/g, '$1<span class="xc-mention">@$2</span>')
      // 영상 시점 [1:23] → 누르면 그 장면으로
      .replace(/\[(\d{1,3}):([0-5]\d)\]/g, (m, mm, ss) => `<button type="button" class="xc-time" data-act="seek" data-t="${+mm * 60 + +ss}">▶ ${mm}:${ss}</button>`);
  }
  const isImage = (f) => /^image\/(png|jpe?g|gif|webp)$/i.test(f.type || '') || /\.(png|jpe?g|gif|webp)$/i.test(f.name || '');

  function renderFiles(c) {
    const files = Array.isArray(c.attachments) ? c.attachments : [];
    if (!files.length) return '';
    const imgs = files.filter(isImage), vids = files.filter(f => App.isVideo(f)), others = files.filter(f => !isImage(f) && !App.isVideo(f));
    return `${imgs.length ? `<div class="xc-imgs n${Math.min(imgs.length, 4)}">${imgs.map(f =>
      `<button type="button" class="xc-img" data-act="img" data-path="${esc(f.path)}" data-name="${esc(f.name)}"><img alt="${esc(f.name)}" data-src="${esc(f.path)}"></button>`).join('')}</div>` : ''}
      ${vids.map(f => `<video class="xc-video" controls playsinline preload="metadata" data-vsrc="${esc(f.path)}" title="${esc(f.name)}"></video>`).join('')}
      ${others.map(f => `<button type="button" class="xc-file" data-act="file" data-path="${esc(f.path)}" data-name="${esc(f.name)}">
        <span>${fileIcon(f.type, f.name)}</span><span class="nm">${esc(f.name)}</span><span class="sz">${fmtSize(f.size)}</span><span>⬇</span></button>`).join('')}`;
  }

  const urlCache = {};
  async function signed(path, download) {
    const key = path + (download ? '|d' : '');
    if (urlCache[key]) return urlCache[key];
    const { data, error } = await sb.storage.from('docs').createSignedUrl(path, 3600, download ? { download } : undefined);
    if (error || !data) throw error || new Error('파일을 열 수 없습니다');
    return (urlCache[key] = data.signedUrl);
  }

  async function loadComments() {
    const v33 = await hasV33;
    // 수정본(v1·v2…)의 코멘트를 한 대화로 이어서 보여준다
    if (!groupDocs) {
      groupDocs = [doc];
      if (doc.group_id) {
        const g = await sb.from('documents').select('id,version,created_at,uploader_id').eq('group_id', doc.group_id).order('version');
        if (!g.error && g.data && g.data.length) groupDocs = g.data;
      }
    }
    const verOf = Object.fromEntries(groupDocs.map(d => [d.id, d.version || 1]));
    const { data } = await sb.from('comments').select('*').in('doc_id', groupDocs.map(d => d.id)).order('created_at');
    const list = data || [];
    let reacts = [];
    if (v33 && list.length) {
      const r = await sb.from('comment_reactions').select('comment_id,user_id,emoji').in('comment_id', list.map(c => c.id));
      reacts = r.data || [];
    }
    document.getElementById('commentCount').textContent = list.length ? `${list.length}개${groupDocs.length > 1 ? ' · 모든 버전' : ''}` : '';
    const box = document.getElementById('comments');
    // 버전이 올라간 시점을 대화 사이에 구분선으로 넣는다
    const timeline = [...list.map(c => ({ c, at: c.created_at }))];
    if (groupDocs.length > 1) groupDocs.forEach(d => timeline.push({ v: d, at: d.created_at }));
    timeline.sort((x, y) => new Date(x.at) - new Date(y.at));
    const canResolve = (c) => 'resolved_at' in c && (c.user_id === me.id || doc.uploader_id === me.id || me.role === 'admin');
    const resolvedN = list.filter(c => c.resolved_at).length;
    document.getElementById('commentCount').textContent += resolvedN ? ` · ✔ 해결 ${resolvedN}` : '';
    box.classList.toggle('show-resolved', showResolved);
    box.innerHTML = (resolvedN ? `<button type="button" class="btn ghost sm xc-toggle" data-act="toggleResolved">${showResolved ? '해결된 의견 숨기기' : `✔ 해결된 의견 ${resolvedN}개 보기`}</button>` : '') +
      (list.length ? timeline.map(({ c, v }) => {
      if (v) return `<div class="xc-ver${v.id === doc.id ? ' cur' : ''}"><span>📄 v${v.version || 1}${(v.version || 1) > 1 ? ' 수정본' : ''} 올림 · ${esc(nameOf[v.uploader_id] || '')} · ${esc(fmtDate(v.created_at))}${v.id === doc.id ? ' · 지금 보는 버전' : ''}</span></div>`;
      const mineR = new Set(reacts.filter(r => r.comment_id === c.id && r.user_id === me.id).map(r => r.emoji));
      const byEmoji = {};
      reacts.filter(r => r.comment_id === c.id).forEach(r => (byEmoji[r.emoji] = byEmoji[r.emoji] || []).push(nameOf[r.user_id] || '?'));
      const pills = REACTIONS.filter(e => byEmoji[e] || e === '❤️').map(e => `
        <button type="button" class="xc-react${mineR.has(e) ? ' on' : ''}${e === '❤️' ? ' heart' : ''}" data-act="react" data-emoji="${e}"
          title="${esc((byEmoji[e] || []).join(', '))}">${e === '❤️' && !mineR.has(e) ? '♡' : e}${byEmoji[e] ? `<span>${byEmoji[e].length}</span>` : ''}</button>`).join('');
      return `
      <article class="xc${c.resolved_at ? ' resolved' : ''}" data-id="${c.id}">
        ${avatar(c.user_id)}
        <div class="xc-main">
          <div class="xc-head"><b>${esc(nameOf[c.user_id] || '(비활성)')}</b>
            <span class="xc-time" title="${esc(fmtDate(c.created_at))}">· ${ago(c.created_at)}</span>
            ${groupDocs.length > 1 ? `<a class="xc-vtag${c.doc_id === doc.id ? ' cur' : ''}" href="doc.html?id=${encodeURIComponent(c.doc_id)}" title="이 코멘트가 달린 버전">v${verOf[c.doc_id] || 1}</a>` : ''}
            ${c.page_no ? `<span class="xc-pg">p.${c.page_no}</span>` : ''}
            ${c.resolved_at ? `<span class="xc-done" title="${esc(nameOf[c.resolved_by] || '')} · ${esc(fmtDate(c.resolved_at))}">✔ 해결됨</span>` : ''}
            ${c.user_id === me.id || me.role === 'admin' ? `<button type="button" class="xc-del" data-act="del">삭제</button>` : ''}
          </div>
          ${c.body ? `<div class="xc-body">${fmtBody(c.body)}</div>` : ''}
          ${renderFiles(c)}
          <div class="xc-actions">
            <button type="button" class="xc-act" data-act="reply" data-name="${esc(nameOf[c.user_id] || '')}">💬 답글</button>
            ${canResolve(c) ? `<button type="button" class="xc-act" data-act="resolve">${c.resolved_at ? '↺ 다시 열기' : '✔ 해결'}</button>` : ''}
            ${v33 ? `${pills}
            <span class="xc-pickwrap"><button type="button" class="xc-act" data-act="pick" title="반응 추가">＋😊</button>
              <span class="xc-picker" hidden>${REACTIONS.map(e => `<button type="button" data-act="react" data-emoji="${e}">${e}</button>`).join('')}</span></span>` : ''}
          </div>
        </div>
      </article>`;
    }).join('') : '<p class="muted">첫 의견을 남겨주세요.</p>');
    // 사진 썸네일은 서명된 주소로 채운다
    box.querySelectorAll('img[data-src]').forEach(img => {
      signed(img.dataset.src).then(u => (img.src = u)).catch(() => (img.alt = '⚠️ ' + img.alt));
    });
    box.querySelectorAll('video[data-vsrc]').forEach(v => signed(v.dataset.vsrc).then(u => { v.src = u; v.removeAttribute('data-vsrc'); }).catch(() => {}));
  }

  function lightbox(src, name) {

  document.getElementById('comments').onclick = async (e) => {
    const b = e.target.closest('[data-act]');
    if (!b) return;
    const art = b.closest('.xc');
    const cid = art && art.dataset.id;
    const act = b.dataset.act;
    try {
      if (act === 'toggleResolved') {
        showResolved = !showResolved;
        loadComments();
      } else if (act === 'resolve') {
        const { error } = await sb.rpc('toggle_comment_resolved', { p_comment: cid });
        if (error) return toast(errMsg(error), true);
        loadComments();
      } else if (act === 'reply') {
        const ta = document.getElementById('commentBody');
        ta.value = `@${b.dataset.name} ` + ta.value.replace(/^@\S+\s/, '');
        ta.focus();
        ta.scrollIntoView({ block: 'center', behavior: 'smooth' });
      } else if (act === 'pick') {
        const pk = b.parentElement.querySelector('.xc-picker');
        document.querySelectorAll('.xc-picker').forEach(p => p !== pk && (p.hidden = true));
        pk.hidden = !pk.hidden;
      } else if (act === 'react') {
        const emoji = b.dataset.emoji;
        const on = !!art.querySelector(`.xc-react.on[data-emoji="${emoji}"]`);
        const { error } = on
          ? await sb.from('comment_reactions').delete().eq('comment_id', cid).eq('user_id', me.id).eq('emoji', emoji)

        if (error) return toast(errMsg(error), true);
        loadComments();
      } else if (act === 'seek') {
        Viewer.seek(+b.dataset.t);
      } else if (act === 'img') {
        lightbox(await signed(b.dataset.path), b.dataset.name);
      } else if (act === 'file') {
        App.logActivity('download', 'comments', cid, b.dataset.name);
        location.href = await signed(b.dataset.path, b.dataset.name);
      } else if (act === 'del') {
        if (!confirm('코멘트를 삭제할까요? 첨부파일도 함께 지워집니다.')) return;
        const { data: c } = await sb.from('comments').select('attachments').eq('id', cid).maybeSingle();

        loadComments();

  function renderPending() {

  async function addFiles(files) {
    if (!(await hasV33)) return;
    for (let f of files) {
      if (pending.length >= MAX_FILES) { toast(`첨부는 ${MAX_FILES}개까지 가능합니다.`, true); break; }
      if (App.isVideo(f)) { try { f = await App.prepareVideo(f); } catch (err) { toast(`${f.name}: ${err.message}`, true); continue; } }
      if (f.size > MAX_FILE) { toast(`${f.name}: 50MB 이하만 올릴 수 있습니다.`, true); continue; }
      // 붙여넣은 캡처는 이름이 image.png 로 오므로 시간을 붙여 구분
      let copy;
      try { copy = await App.snapshotFile(f); } catch (err) { toast(err.message, true); continue; }
      pending.push(f.name === 'image.png' ? new File([copy], `캡처_${new Date().toTimeString().slice(0, 8).replace(/:/g, '')}.png`, { type: f.type }) : copy);
    }
    renderPending();
  }
  document.getElementById('commentFiles').onchange = (e) => { addFiles([...e.target.files]); e.target.value = ''; };
  ta.addEventListener('paste', (e) => {
    const files = [...(e.clipboardData && e.clipboardData.files || [])];
    if (files.length) { e.preventDefault(); addFiles(files); }
  });
  form.addEventListener('dragover', (e) => { e.preventDefault(); form.classList.add('drag'); });
  form.addEventListener('dragleave', () => form.classList.remove('drag'));
  form.addEventListener('drop', (e) => { e.preventDefault(); form.classList.remove('drag'); addFiles([...e.dataTransfer.files]); });

  const panel = document.getElementById('emojiPanel');
  panel.innerHTML = EMOJIS.map(e => `<button type="button">${e}</button>`).join('');
  document.getElementById('emojiBtn').onclick = () => { panel.hidden = !panel.hidden; };
  panel.onclick = (e) => {
    const b = e.target.closest('button');
    if (!b) return;
    const at = ta.selectionStart ?? ta.value.length;
    ta.value = ta.value.slice(0, at) + b.textContent + ta.value.slice(ta.selectionEnd ?? at);
    ta.selectionStart = ta.selectionEnd = at + b.textContent.length;
    ta.focus();
    grow();
  };
  document.addEventListener('click', (e) => {
    if (!e.target.closest('#emojiPanel, #emojiBtn')) panel.hidden = true;
    if (!e.target.closest('.xc-pickwrap')) document.querySelectorAll('.xc-picker').forEach(p => (p.hidden = true));
  });

  form.onsubmit = async (e) => {
    e.preventDefault();
    const body = ta.value.trim();
    const page = parseInt(document.getElementById('pageNo').value, 10);
    if (!body && !pending.length) return toast('의견을 쓰거나 파일을 붙여 주세요.', true);
    const btn = document.getElementById('postBtn');
    btn.disabled = true;
    const uploaded = [];
    try {
      for (const f of pending) {
        btn.textContent = `올리는 중 ${uploaded.length + 1}/${pending.length}`;
        const ext = ((f.name.match(/\.([A-Za-z0-9]{1,8})$/) || [, 'bin'])[1]).toLowerCase();
        const rand = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(36).slice(2);
        const path = `${me.id}/c/${rand}.${ext}`;
        const up = await App.uploadFile(path, f);
        if (up.error) throw up.error;
        uploaded.push({ path, name: f.name, type: f.type || ext, size: f.size });
      }
      const row = { doc_id: docId, user_id: me.id, body, page_no: Number.isFinite(page) ? page : null };
      if (uploaded.length) row.attachments = uploaded;
      const { error } = await sb.from('comments').insert(row);
      if (error) throw error;
      ta.value = ''; grow();
      document.getElementById('pageNo').value = '';
      pending = []; renderPending();
      loadComments();
    } catch (err) {
      if (uploaded.length) await sb.storage.from('docs').remove(uploaded.map(u => u.path)).catch(() => {});
      toast(errMsg(err), true);
    } finally {
      btn.disabled = false;
      btn.textContent = '게시';
    }
  };

  // ----- 사건 · 버전 · 재상신 (v2) -----
  async function loadVersions() {
    if (!doc.group_id) return;  // v2 DB 업데이트 전
    if (doc.case_id) {
      const { data: c } = await sb.from('cases').select('id,name').eq('id', doc.case_id).maybeSingle();
      if (c) {
        const el = document.getElementById('caseLink');
        el.innerHTML = `⚖️ 사건: <a href="case.html?id=${encodeURIComponent(c.id)}">${esc(c.name)}</a>`;
        el.hidden = false;
      }
    }
    const { data: vers } = await sb.from('documents').select('id,version,status,created_at,uploader_id').eq('group_id', doc.group_id).order('version');
    const list = vers || [];
    // 버전마다 누가 컨펌·반려했는지 (v2에서도 v1 결과를 볼 수 있게)
    const stepsOf = {};
    if (list.length > 1) {
      const { data: vs } = await sb.from('approval_steps').select('doc_id,approver_id,state,step_order').in('doc_id', list.map(v => v.id)).order('step_order');
      (vs || []).forEach(s => (stepsOf[s.doc_id] = stepsOf[s.doc_id] || []).push(s));
    }
    const ICON = { approved: '✅', rejected: '↩️', current: '⏳', waiting: '⏳', skipped: '—' };
    const latest = list.length ? list[list.length - 1] : doc;
    if (list.length > 1) {
      document.getElementById('versionsCard').hidden = false;
      document.getElementById('versions').innerHTML = list.map(v => `
        <li${v.id === doc.id ? ' class="cur"' : ''}>
          <span>${v.id === doc.id ? `<b>v${v.version} (지금 보는 버전)</b>` : `<a href="doc.html?id=${encodeURIComponent(v.id)}">v${v.version}</a>`}
            ${statusBadge(v.status)}</span>
          <span class="when">${esc(nameOf[v.uploader_id] || '')} · ${fmtDate(v.created_at)}</span>
          <span class="ver-steps">${(stepsOf[v.id] || []).length
            ? stepsOf[v.id].map(s => `${esc(nameOf[s.approver_id] || '?')} ${ICON[s.state] || ''}`).join(' · ')
            : '컨펌자 없음'}</span>
        </li>`).join('');
    }
    if (latest.id !== doc.id) {
      const n = document.getElementById('rejectedNotice');
      n.hidden = false;
      n.innerHTML = `이 문서는 예전 버전(v${doc.version})입니다. <a href="doc.html?id=${encodeURIComponent(latest.id)}"><b>최신 v${latest.version} 보기 →</b></a>`;
      return;
    }
    if (doc.uploader_id === me.id || me.role === 'admin') {
      const btn = document.getElementById('resubmitBtn');
      btn.href = `upload.html?prev=${encodeURIComponent(doc.id)}`;
      btn.hidden = false;
      if (doc.status === 'rejected') {
        btn.className = 'btn';
        const n = document.getElementById('rejectedNotice');
        n.hidden = false;
        n.innerHTML = '컨펌자 전원이 반려한 문서입니다. 의견을 반영해 <b>📝 수정본 올리기</b>로 다시 요청하거나, 위 <b>＋ 컨펌자 추가</b>로 다른 분께 컨펌을 받으세요.';
      }
    }
  }

  // 한 카드가 실패해도 나머지는 그려지도록 따로 기다린다
  loadVersions().catch(e => console.warn(e));
  Viewer.start();

  // ⏱ 영상 장면 코멘트: 지금 재생 시점을 [m:ss] 로 넣는다
  const timeBtn = document.getElementById('timeBtn');
  setInterval(() => {
    const v = Viewer.currentVideo();
    timeBtn.hidden = !v;
    if (v) timeBtn.textContent = `⏱ ${App.fmtT(v.currentTime)}`;
  }, 500);
  timeBtn.onclick = () => {
    const v = Viewer.currentVideo(); if (!v) return;
    v.pause();
    const ta = document.getElementById('commentBody'), tag = `[${App.fmtT(v.currentTime)}] `;
    const at = ta.selectionStart ?? ta.value.length;
    ta.value = ta.value.slice(0, at) + tag + ta.value.slice(at);
    ta.focus(); ta.selectionStart = ta.selectionEnd = at + tag.length;
    ta.dispatchEvent(new Event('input'));
  };

  // ----- 첨삭 목록: 밑줄·메모·도장은 '고침 체크'를 할 수 있다 -----
  var markFilter = 'all';  // var: 뷰어가 먼저 그려질 때도 참조할 수 있게
  function renderMarkupList() {
    const items = Viewer.anns.filter(a => ['fix', 'underline', 'note', 'stamp', 'highlight', 'pen'].includes(a.kind) && !String(a.id).startsWith('tmp'));
    const cardEl = document.getElementById('markupCard');
    cardEl.hidden = !items.length;
    if (!items.length) return;
    const open = items.filter(a => a.kind !== 'pen' && a.kind !== 'highlight' && !a.checked_at).length;
    document.getElementById('markupCount').textContent = `${items.length}${open ? ` · 반영할 것 ${open}` : ''}`;
    const fname = (p) => (allFiles.find(f => f.path === p) || {}).name || '';
    document.getElementById('markupFilter').innerHTML = [['all', '전체'], ['todo', '반영할 것'], ['done', '반영됨']]
      .map(([k, v]) => `<button type="button" class="chip${markFilter === k ? ' on' : ''}" data-f="${k}">${v}</button>`).join('');
    const rows = items.filter(a => markFilter === 'all' || (markFilter === 'todo' ? !a.checked_at : !!a.checked_at))
      .sort((a, b) => (a.file_path > b.file_path) - (a.file_path < b.file_path) || a.page - b.page || (a.created_at < b.created_at ? -1 : 1));
    document.getElementById('markupList').innerHTML = rows.map(a => `
      <li class="mk-item${a.checked_at ? ' done' : ''}">
        ${Viewer.canCheck(a) ? `<button type="button" class="mk-check" data-chk="${esc(a.id)}" title="고침 체크">${a.checked_at ? '☑' : '☐'}</button>` : `<span class="mk-check">${a.checked_at ? '☑' : '☐'}</span>`}
        <button type="button" class="mk-go" data-go="${esc(a.id)}">
          <span class="mk-top">${avatar(a.user_id, 20)}<b>${esc(nameOf[a.user_id] || '(퇴사자)')}</b>
            <span class="muted">${Viewer.KIND_LABEL[a.kind] || ''} · ${allFiles.length > 1 ? esc(fname(a.file_path)) + ' ' : ''}p.${a.page}</span></span>
          ${a.kind === 'note' ? `<span class="mk-body">${esc(a.body || '')}</span>` : a.kind === 'stamp' ? `<span class="mk-body">🔖 ${esc(Viewer.STAMPS[a.body] || '')}</span>`
            : a.kind === 'fix' ? `<span class="mk-body pv-fixbody">${a.data && a.data.orig ? `<del>${esc(a.data.orig)}</del> → ` : ''}<ins>${esc(a.body || '')}</ins></span>` : ''}
          <span class="mk-meta">${esc(fmtDate(a.created_at))}${(Viewer.replies[a.id] || []).length ? ` · 💬 답글 ${Viewer.replies[a.id].length}` : ''}${a.checked_at ? ` · ✔ ${esc(nameOf[a.checked_by] || '')} 반영` : ''}</span>
        </button>
      </li>`).join('') || '<li class="muted">해당 항목이 없습니다.</li>';
  }
  document.getElementById('markupCard').addEventListener('click', (e) => {
    const f = e.target.closest('[data-f]'), c = e.target.closest('[data-chk]'), g = e.target.closest('[data-go]');
    if (f) { markFilter = f.dataset.f; renderMarkupList(); }
    else if (c) Viewer.toggleCheck(c.dataset.chk);
    else if (g) { Viewer.focus(g.dataset.go); setTimeout(() => Viewer.openPop(g.dataset.go), 700); }
  });
  await Promise.allSettled([loadSteps(), loadViews(), loadComments().catch(e => console.warn('코멘트 불러오기 실패', e))]);

  // 다른 사람의 코멘트·열람·컨펌를 실시간 반영
  const filter = `doc_id=eq.${docId}`;
  sb.channel(`doc-${docId}`)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'comments' }, () => { clearTimeout(reactT); reactT = setTimeout(loadComments, 300); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'comment_reactions' }, () => { clearTimeout(reactT); reactT = setTimeout(loadComments, 300); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'document_views', filter }, loadViews)
    .on('postgres_changes', { event: '*', schema: 'public', table: 'approval_steps', filter }, loadSteps)
    .subscribe();
})().catch(e => console.warn(e.message));
</script>
</body>
</html>
