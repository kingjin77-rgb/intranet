<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>일정 · 사내 인트라넷</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#13294b">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인트라넷">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=6.3.2">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js?v=6.3.2"></script>
<script src="app.js?v=6.3.2"></script>
</head>
<body>
<main class="container">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:0">
      <div class="page-title">일정</div>
      <p class="muted">기일·마감·미팅을 등록하면 전날과 당일에 PC 알림이 갑니다.</p>
    </div>
    <button class="btn" id="newBtn">＋ 일정 추가</button>
  </div>
  <div id="v2"></div>

  <form class="card" id="evForm" hidden style="margin-top:16px">
    <h2>일정 추가</h2>
    <div class="grid2">
      <div><label for="eTitle">제목</label><input type="text" id="eTitle" required maxlength="100" placeholder="예) 1차 변론기일"></div>
      <div><label for="eKind">종류</label>
        <select id="eKind"><option value="hearing">기일</option><option value="deadline">마감</option><option value="meeting">미팅</option><option value="etc">기타</option></select></div>
      <div><label for="eDate">날짜</label><input type="date" id="eDate" required></div>
      <div><label for="eTime">시간 (비우면 종일)</label><input type="time" id="eTime"></div>
      <div><label for="eCase">사건 (선택)</label><select id="eCase"><option value="">사건 없음</option></select></div>
      <div><label for="eLoc">장소 (선택)</label><input type="text" id="eLoc" maxlength="100" placeholder="예) 서울중앙지법 동관 456호"></div>
    </div>
    <label for="eMemo">메모 (선택)</label><textarea id="eMemo" maxlength="1000"></textarea>
    <div class="btn-row"><button class="btn" type="submit">등록</button><button class="btn ghost" type="button" id="cancelEv">취소</button></div>
  </form>

  <div class="detail-grid" style="margin-top:16px">
    <div><div class="card">
      <div class="cal-head">
        <button class="btn ghost sm" id="prev">◀</button>
        <b id="monthLabel"></b>
        <button class="btn ghost sm" id="next">▶</button>
        <button class="btn ghost sm" id="todayBtn">오늘</button>
      </div>
      <div class="cal" id="cal"></div>
      <div id="dayList" style="margin-top:12px"></div>
    </div></div>
    <div><div class="card">
      <h2>⏰ 다가오는 일정 (30일)</h2>
      <ul class="people" id="upcoming"></ul>
    </div></div>
  </div>
</main>
<script>
(async () => {
  const { sb, esc, toast, errMsg } = App;
  const me = await App.requireAuth();
  if (!(await App.hasV2())) { document.getElementById('v2').innerHTML = App.V2_NOTICE; document.querySelector('.detail-grid').hidden = true; document.getElementById('newBtn').hidden = true; return; }
  const params = new URLSearchParams(location.search);
  const cases = await App.loadCases(true);
  const caseName = Object.fromEntries(cases.map(c => [c.id, c.name]));
  document.getElementById('eCase').innerHTML += cases.filter(c => c.status === 'open')
    .map(c => `<option value="${c.id}">${esc(c.name)}</option>`).join('');

  const pad = n => String(n).padStart(2, '0');
  const ymd = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const timeOf = e => e.all_day ? '종일' : new Date(e.starts_at).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
  let cur = new Date(); cur.setDate(1);
  let selected = ymd(new Date());
  let monthEvents = [];

  function evLine(e, withDate) {
    const d = new Date(e.starts_at);
    return `<li>
      <span><span class="badge ev-${e.kind}">${App.EVENT_KIND[e.kind]}</span> ${esc(e.title)}
        ${e.case_id && caseName[e.case_id] ? `<a class="muted" href="case.html?id=${encodeURIComponent(e.case_id)}">· ${esc(caseName[e.case_id])}</a>` : ''}
        ${e.location ? `<span class="muted">· ${esc(e.location)}</span>` : ''}</span>
      <span class="when">${withDate ? `${App.dday(e.starts_at)} · ${d.getMonth() + 1}/${d.getDate()} ` : ''}${timeOf(e)}
        ${e.created_by === me.id || me.role === 'admin' ? `<button class="link-btn" data-del="${e.id}">삭제</button>` : ''}</span>
    </li>`;
  }

  let monthLeaves = [], leaveNames = null;
  async function loadMonth() {
    const start = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const end = new Date(cur.getFullYear(), cur.getMonth() + 1, 1);
    const { data, error } = await sb.from('events').select('*').gte('starts_at', start.toISOString()).lt('starts_at', end.toISOString()).order('starts_at');
    if (error) return toast(errMsg(error), true);
    monthEvents = data;
    // 승인된 휴가·외근도 달력에 표시 (008 실행 후)
    monthLeaves = [];
    if (await App.hasV5()) try {
      const s0 = ymd(start), e0 = ymd(new Date(end - 1));
      const [lv, mem] = await Promise.all([
        sb.from('leave_requests').select('user_id,kind,start_date,end_date').eq('status', 'approved').lte('start_date', e0).gte('end_date', s0),
        leaveNames ? null : App.loadMembers(),
      ]);
      if (mem) leaveNames = Object.fromEntries(mem.map(m => [m.id, m.name]));
      monthLeaves = (lv.data || []);
    } catch (e) { console.warn('휴가 표시 실패', e); }
    renderCal();
  }

  function renderCal() {
    document.getElementById('monthLabel').textContent = `${cur.getFullYear()}년 ${cur.getMonth() + 1}월`;
    const first = new Date(cur.getFullYear(), cur.getMonth(), 1);
    const days = new Date(cur.getFullYear(), cur.getMonth() + 1, 0).getDate();
    const byDay = {};
    monthEvents.forEach(e => { const k = ymd(new Date(e.starts_at)); (byDay[k] = byDay[k] || []).push(e); });
    const today = ymd(new Date());
    let html = ['일', '월', '화', '수', '목', '금', '토'].map((w, i) => `<div class="cal-w${i === 0 ? ' sun' : i === 6 ? ' sat' : ''}">${w}</div>`).join('');
    for (let i = 0; i < first.getDay(); i++) html += '<div class="cal-d empty"></div>';
    for (let d = 1; d <= days; d++) {
      const k = `${cur.getFullYear()}-${pad(cur.getMonth() + 1)}-${pad(d)}`;
      const evs = byDay[k] || [];
      const lvs = monthLeaves.filter(l => l.start_date <= k && l.end_date >= k);
      html += `<button class="cal-d${k === today ? ' today' : ''}${k === selected ? ' sel' : ''}" data-day="${k}">
        <span class="n">${d}</span>
        ${evs.slice(0, 3).map(e => `<span class="cal-ev ev-${e.kind}">${esc(e.title)}</span>`).join('')}
        ${lvs.slice(0, Math.max(0, 3 - evs.length)).map(l => `<span class="cal-ev ev-leave">🌴 ${esc((leaveNames || {})[l.user_id] || '')} ${esc(l.kind)}</span>`).join('')}
        ${evs.length + lvs.length > 3 ? `<span class="cal-more">+${evs.length + lvs.length - 3}</span>` : ''}
      </button>`;
    }
    document.getElementById('cal').innerHTML = html;
    const sel = (byDay[selected] || []);
    const [y, m, dd] = selected.split('-');
    document.getElementById('dayList').innerHTML = `<b>${+m}월 ${+dd}일</b>
      <ul class="people" style="margin-top:6px">${sel.length ? sel.map(e => evLine(e, false)).join('') : ''}
      ${monthLeaves.filter(l => l.start_date <= selected && l.end_date >= selected).map(l => `<li><span>🌴 <b>${esc((leaveNames || {})[l.user_id] || '')}</b> ${esc(l.kind)}</span><span class="when">${l.start_date.slice(5)} ~ ${l.end_date.slice(5)}</span></li>`).join('')
        || (sel.length ? '' : '<li class="muted">일정 없음</li>')}</ul>`;
  }

  async function loadUpcoming() {
    const t = new Date(); t.setHours(0, 0, 0, 0);
    const until = new Date(t); until.setDate(until.getDate() + 31);
    const { data } = await sb.from('events').select('*').gte('starts_at', t.toISOString()).lt('starts_at', until.toISOString()).order('starts_at');
    const list = data || [];
    document.getElementById('upcoming').innerHTML = list.length ? list.map(e => evLine(e, true)).join('') : '<li class="muted">30일 안에 일정이 없습니다.</li>';
  }

  const form = document.getElementById('evForm');
  const openForm = (day) => {
    form.hidden = false;
    document.getElementById('eDate').value = day || selected;
    document.getElementById('eTitle').focus();
  };
  document.getElementById('newBtn').onclick = () => openForm();
  document.getElementById('cancelEv').onclick = () => (form.hidden = true);
  form.onsubmit = async (e) => {
    e.preventDefault();
    const date = document.getElementById('eDate').value, time = document.getElementById('eTime').value;
    const startsAt = new Date(`${date}T${time || '00:00'}:00`);
    const { error } = await sb.from('events').insert({
      title: document.getElementById('eTitle').value.trim(),
      kind: document.getElementById('eKind').value,
      starts_at: startsAt.toISOString(), all_day: !time,
      case_id: document.getElementById('eCase').value || null,
      location: document.getElementById('eLoc').value.trim() || null,
      memo: document.getElementById('eMemo').value.trim() || null,
      created_by: me.id,
    });
    if (error) return toast(errMsg(error), true);
    form.reset(); form.hidden = true; toast('일정을 등록했습니다.');
    selected = date; cur = new Date(startsAt.getFullYear(), startsAt.getMonth(), 1);
    loadMonth(); loadUpcoming();
  };

  document.querySelector('main').addEventListener('click', async (e) => {
    const day = e.target.closest('[data-day]');
    if (day) { selected = day.dataset.day; renderCal(); return; }
    const del = e.target.closest('[data-del]');
    if (del && confirm('이 일정을 삭제할까요?')) {
      const { error } = await sb.from('events').delete().eq('id', del.dataset.del);
      if (error) return toast(errMsg(error), true);
      loadMonth(); loadUpcoming();
    }
  });
  document.getElementById('prev').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() - 1, 1); loadMonth(); };
  document.getElementById('next').onclick = () => { cur = new Date(cur.getFullYear(), cur.getMonth() + 1, 1); loadMonth(); };
  document.getElementById('todayBtn').onclick = () => { cur = new Date(); cur.setDate(1); selected = ymd(new Date()); loadMonth(); };

  if (params.get('case')) document.getElementById('eCase').value = params.get('case');
  if (params.get('new')) openForm();
  await Promise.all([loadMonth(), loadUpcoming()]);
})().catch(e => console.warn(e.message));
</script>
</body>
</html>
