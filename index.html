<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>문서함 · 사내 인트라넷</title>
<meta property="og:title" content="사내 인트라넷 문서함">
<meta property="og:description" content="제안서·자료 공유, 열람확인, 코멘트, 컨펌">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a4f8a">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인트라넷">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=6.1.1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js?v=6.1.1"></script>
<script src="app.js?v=6.1.1"></script>
</head>
<body>
<main class="container">
  <div style="display:flex;align-items:center;gap:12px;flex-wrap:wrap">
    <div style="flex:1;min-width:0">
      <div class="page-title">문서함</div>
      <p class="muted">카톡에는 문서 링크만 올리고, 확인·의견·컨펌는 여기서 하세요.</p>
    </div>
    <a class="btn" href="upload.html">＋ 문서 올리기</a>
  </div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="all">전체</button>
    <button class="tab" data-tab="myturn">내 컨펌 대기 <span id="myturnCount"></span></button>
    <button class="tab" data-tab="unread">안 읽은 문서 <span id="unreadCount"></span></button>
    <button class="tab" data-tab="mine">내가 올린 문서</button>
    <button class="tab" data-tab="history">컨펌 기록</button>
  </div>
  <div class="filter-row">
    <input type="text" id="search" placeholder="제목·올린 사람·사건 검색">
    <select id="caseFilter" hidden><option value="">전체 사건</option></select>
  </div>

  <div class="doc-list" id="list"><div class="empty">불러오는 중…</div></div>
</main>
<script>
(async () => {
  const { sb, esc, fmtDate, statusBadge, toast, errMsg, fileIcon } = App;
  const me = await App.requireAuth();

  let docs = [], allDocs = [], stepsOf = {}, nameOf = {}, seen = new Set(), memberCount = 0, tab = 'all';
  const ICON = { approved: '✅', rejected: '↩️', current: '⏳', waiting: '⏳', skipped: '—' };
  const WORD = { approved: '컨펌', rejected: '반려', current: '대기', waiting: '대기', skipped: '—' };

  async function load() {
    const [d, v, m, s, p] = await Promise.all([
      sb.from('document_summary').select('*').order('created_at', { ascending: false }),
      sb.from('document_views').select('doc_id').eq('user_id', me.id),
      sb.from('profiles').select('id', { count: 'exact', head: true }).eq('active', true),
      sb.from('approval_steps').select('doc_id,approver_id,state,acted_at,step_order').order('step_order'),
      sb.from('profiles').select('id,name'),
    ]);
    const err = d.error || v.error || m.error;
    if (err) return toast(errMsg(err), true);
    // 수정본이 있으면 최신본만 목록에 (v2 DB 전이면 is_latest 가 없어서 전부 보임)
    allDocs = d.data;
    docs = d.data.filter(x => x.is_latest !== false);
    // 컨펌·반려가 끝나도 누가 어떻게 처리했는지 목록에 남긴다
    stepsOf = {}; nameOf = {};
    (s.data || []).forEach(r => (stepsOf[r.doc_id] = stepsOf[r.doc_id] || []).push(r));
    (p.data || []).forEach(r => nameOf[r.id] = r.name);
    seen = new Set(v.data.map(r => r.doc_id));
    memberCount = m.count || 0;
    render();
  }

  function render() {
    const q = document.getElementById('search').value.trim().toLowerCase();
    const myturn = docs.filter(x => x.current_approver_id === me.id);
    const unread = docs.filter(x => !seen.has(x.id) && x.uploader_id !== me.id);
    document.getElementById('myturnCount').textContent = myturn.length ? `(${myturn.length})` : '';
    document.getElementById('unreadCount').textContent = unread.length ? `(${unread.length})` : '';

    // 컨펌 기록: 내가 컨펌자였거나 컨펌을 요청한 문서 전부 (수정본 전 예전 버전 포함), 최근 처리 순
    const lastAct = (x) => (stepsOf[x.id] || []).reduce((a, r) => r.acted_at && r.acted_at > a ? r.acted_at : a, x.created_at);
    const history = allDocs.filter(x => (stepsOf[x.id] || []).some(r => r.approver_id === me.id) || (x.uploader_id === me.id && (stepsOf[x.id] || []).length))
      .sort((a, b) => lastAct(b) < lastAct(a) ? -1 : 1);
    let rows = { all: docs, myturn, unread, mine: docs.filter(x => x.uploader_id === me.id), history }[tab];
    if (q) rows = rows.filter(x => [x.title, x.uploader_name, x.case_name].some(v => (v || '').toLowerCase().includes(q)));
    const cf = document.getElementById('caseFilter').value;
    if (cf) rows = rows.filter(x => x.case_id === cf);

    const list = document.getElementById('list');
    if (!rows.length) {
      list.innerHTML = `<div class="empty">${tab === 'myturn' ? '컨펌할 문서가 없습니다 👍' : tab === 'history' ? '컨펌 기록이 없습니다' : '문서가 없습니다'}</div>`;
      return;
    }
    list.innerHTML = rows.map(x => `
      <a class="doc-item" href="doc.html?id=${encodeURIComponent(x.id)}">
        <div class="row1">
          <span>${x.kind === 'form' ? '📝' : fileIcon(x.file_type, x.file_name)}</span>
          <span class="title">${esc(x.title)}</span>
          ${x.version > 1 || x.is_latest === false ? `<span class="badge none">v${x.version}${x.is_latest === false ? " (예전 버전)" : ""}</span>` : ''}
          ${(x.extra_files || []).length ? `<span class="badge none" title="파일 ${x.extra_files.length + 1}개">📎 ${x.extra_files.length + 1}</span>` : ''}
          ${x.current_approver_id === me.id ? '<span class="badge myturn">내 차례</span>' : ''}
          ${x.due_date && x.status === 'pending' ? App.dueBadge(x.due_date) : ''}
          ${!seen.has(x.id) && x.uploader_id !== me.id ? '<span class="badge pending">NEW</span>' : ''}
          ${statusBadge(x.status)}
        </div>
        <div class="meta">
          ${x.case_name ? `<span>⚖️ ${esc(x.case_name)}</span>` : ''}
          <span>${esc(x.uploader_name)} · ${fmtDate(x.created_at)}</span>
          <span>👀 열람 ${x.view_count}/${memberCount}명</span>
          <span>💬 ${x.comment_count}</span>
        </div>
        ${(stepsOf[x.id] || []).length ? `<div class="step-chips">${stepsOf[x.id].map(r => `<span class="step-chip ${r.state}${r.approver_id === me.id ? ' me' : ''}"
          title="${r.acted_at ? fmtDate(r.acted_at) : ''}">${ICON[r.state] || ''} ${esc(nameOf[r.approver_id] || '(퇴사자)')}${r.approver_id === me.id ? '(나)' : ''} ${WORD[r.state] || ''}</span>`).join('')}</div>` : ''}
      </a>`).join('');
  }

  document.getElementById('tabs').onclick = (e) => {
    const b = e.target.closest('.tab');
    if (!b) return;
    tab = b.dataset.tab;
    document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t === b));
    render();
  };
  document.getElementById('search').oninput = render;
  document.getElementById('caseFilter').onchange = render;
  App.hasV2().then(async (ok) => {
    if (!ok) return;
    const cases = await App.loadCases(true).catch(() => []);
    const sel = document.getElementById('caseFilter');
    sel.innerHTML += cases.map(c => `<option value="${c.id}">${esc(c.name)}${c.status === 'closed' ? ' (종결)' : ''}</option>`).join('');
    sel.hidden = !cases.length;
  });

  const initTab = new URLSearchParams(location.search).get('tab');
  if (['myturn', 'unread', 'mine', 'history'].includes(initTab)) document.querySelector(`[data-tab=${initTab}]`).click();
  await load();

  // 다른 사람이 문서를 올리거나 컨펌이 진행되면 목록 갱신
  let t;
  sb.channel('list')
    .on('postgres_changes', { event: '*', schema: 'public', table: 'documents' }, () => { clearTimeout(t); t = setTimeout(load, 500); })
    .on('postgres_changes', { event: '*', schema: 'public', table: 'approval_steps' }, () => { clearTimeout(t); t = setTimeout(load, 500); })
    .subscribe();
})().catch(e => console.warn(e.message));
</script>
</body>
</html>
