<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>근태·예약 · 사내 인트라넷</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a4f8a">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인트라넷">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=6.2.1">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js?v=6.2.1"></script>
<script src="app.js?v=6.2.1"></script>
</head>
<body>
<main class="container">
  <div class="page-title">근태·예약</div>
  <div id="v5"></div>
  <div class="tabs" id="tabs">
    <button class="tab active" data-tab="clock">🕘 출퇴근</button>
    <button class="tab" data-tab="leave">🌴 휴가·외근 <span id="leaveBadge"></span></button>
    <button class="tab" data-tab="book">📅 회의실·차량 예약</button>
  </div>

  <!-- 출퇴근 -->
  <section data-pane="clock">
    <div class="card clock-card">
      <div class="clock-now" id="clockNow"></div>
      <div class="clock-state" id="clockState">불러오는 중…</div>
      <div class="btn-row" style="justify-content:center">
        <button class="btn big" id="inBtn">출근</button>
        <button class="btn ghost big" id="outBtn">퇴근</button>
      </div>
      <input type="text" id="clockNote" maxlength="100" placeholder="메모 (선택) 예) 법원 들렀다 출근">
    </div>
    <div class="card">
      <h2>내 기록 <span class="count" id="myMonthLabel"></span></h2>
      <div class="table-wrap"><table><thead><tr><th>날짜</th><th>출근</th><th>퇴근</th><th>근무</th><th>메모</th></tr></thead><tbody id="myClock"></tbody></table></div>
    </div>
    <div class="card" id="adminClock" hidden>
      <h2>전 직원 출퇴근 (관리자)</h2>
      <div class="filter-row">
        <input type="month" id="clockMonth">
        <button class="btn ghost sm" id="csvBtn">⬇ 엑셀(CSV) 받기</button>
      </div>
      <div class="table-wrap"><table><thead><tr><th>이름</th><th>출근일</th><th>지각(9:10 이후)</th><th>평균 근무</th><th>오늘</th></tr></thead><tbody id="allClock"></tbody></table></div>
    </div>
  </section>

  <!-- 휴가·외근 -->
  <section data-pane="leave" hidden>
    <form class="card" id="leaveForm">
      <h2>신청</h2>
      <div class="grid2">
        <div><label for="lKind">종류</label>
          <select id="lKind"><option>연차</option><option>오전반차</option><option>오후반차</option><option>외근</option><option>출장</option><option>병가</option><option>경조</option><option>기타</option></select></div>
        <div><label for="lApprover">승인자</label><select id="lApprover" required></select></div>
        <div><label for="lStart">시작일</label><input type="date" id="lStart" required></div>
        <div><label for="lEnd">종료일</label><input type="date" id="lEnd" required></div>
      </div>
      <label for="lReason">사유 (선택)</label><input type="text" id="lReason" maxlength="200" placeholder="예) 가족 행사 / ○○법원 변론">
      <div class="btn-row"><button class="btn" type="submit">신청하기</button></div>
    </form>
    <div class="card" id="toApproveCard" hidden>
      <h2>✍️ 내가 승인할 신청 <span class="count" id="toApproveCount"></span></h2>
      <ul class="people leave-list" id="toApprove"></ul>
    </div>
    <div class="card">
      <h2>내 신청</h2>
      <ul class="people leave-list" id="myLeaves"></ul>
    </div>
    <div class="card">
      <h2>다가오는 휴가·외근 (승인됨)</h2>
      <ul class="people leave-list" id="upcoming"></ul>
    </div>
  </section>

  <!-- 예약 -->
  <section data-pane="book" hidden>
    <div class="card">
      <div class="filter-row">
        <select id="bResource"></select>
        <input type="date" id="bDate">
      </div>
      <div class="book-day" id="bookDay"></div>
    </div>
    <form class="card" id="bookForm">
      <h2>예약하기</h2>
      <div class="grid2">
        <div><label for="bStart">시작</label><input type="time" id="bStart" required step="600"></div>
        <div><label for="bEnd">끝</label><input type="time" id="bEnd" required step="600"></div>
      </div>
      <label for="bTitle">용도</label><input type="text" id="bTitle" required maxlength="100" placeholder="예) ○○건 의뢰인 미팅">
      <div class="btn-row"><button class="btn" type="submit">예약</button></div>
    </form>
    <div class="card" id="resAdmin" hidden>
      <h2>예약 대상 관리 (관리자)</h2>
      <div class="filter-row">
        <input type="text" id="resName" maxlength="40" placeholder="예) 소회의실, 법인차량 2호">
        <select id="resKind"><option value="room">회의실</option><option value="car">차량</option><option value="etc">기타</option></select>
        <button class="btn sm" id="resAdd" type="button">추가</button>
      </div>
      <ul class="people" id="resList"></ul>
    </div>
  </section>
</main>
<script>
(async () => {
  const { sb, esc, toast, errMsg, fmtDate } = App;
  const me = await App.requireAuth();
  if (!(await App.hasV5())) {
    document.getElementById('v5').innerHTML = App.V5_NOTICE;
    document.querySelectorAll('[data-pane], #tabs').forEach(e => (e.hidden = true));
    return;
  }
  const admin = me.role === 'admin';
  const { data: ppl } = await sb.from('profiles').select('*').order('name');
  App.remember(ppl);
  const people = Object.fromEntries((ppl || []).map(p => [p.id, p]));
  const nameOf = (id) => (people[id] && people[id].name) || '(퇴사자)';
  const kst = (d = new Date()) => App.ymdLocal(d);
  const hm = (iso) => iso ? new Date(iso).toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false }) : '';
  const dur = (a, b) => { if (!a || !b) return ''; const m = Math.round((new Date(b) - new Date(a)) / 60000); return `${Math.floor(m / 60)}시간 ${m % 60}분`; };
  const md = (d) => d ? `${+d.slice(5, 7)}/${+d.slice(8, 10)}` : '';

  // 탭
  const tabs = document.getElementById('tabs');
  function show(t) {
    tabs.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    document.querySelectorAll('[data-pane]').forEach(p => (p.hidden = p.dataset.pane !== t));
    history.replaceState(null, '', '#' + t);
  }
  tabs.onclick = (e) => { const b = e.target.closest('.tab'); if (b) show(b.dataset.tab); };
  if (['leave', 'book'].includes(location.hash.slice(1))) show(location.hash.slice(1));

  // ===== 출퇴근 =====
  const tick = () => (document.getElementById('clockNow').textContent = new Date().toLocaleString('ko-KR', { month: 'long', day: 'numeric', weekday: 'short', hour: '2-digit', minute: '2-digit' }));
  tick(); setInterval(tick, 15000);
  async function loadClock() {
    const monthStart = kst().slice(0, 8) + '01';
    const { data } = await sb.from('attendance').select('*').eq('user_id', me.id).gte('work_date', monthStart).order('work_date', { ascending: false });
    const rows = data || [];
    const today = rows.find(r => r.work_date === kst());
    document.getElementById('clockState').innerHTML = !today || !today.check_in ? '아직 출근 전입니다'
      : today.check_out ? `오늘 <b>${hm(today.check_in)}</b> 출근 · <b>${hm(today.check_out)}</b> 퇴근 (${dur(today.check_in, today.check_out)})`
      : `<b>${hm(today.check_in)}</b> 출근했습니다 · 근무 중`;
    document.getElementById('inBtn').disabled = !!(today && today.check_in);
    document.getElementById('myMonthLabel').textContent = `${+monthStart.slice(5, 7)}월`;
    document.getElementById('myClock').innerHTML = rows.length ? rows.map(r => `<tr><td>${md(r.work_date)}</td><td>${hm(r.check_in)}</td><td>${hm(r.check_out)}</td><td>${dur(r.check_in, r.check_out)}</td><td>${esc(r.note || '')}</td></tr>`).join('')
      : '<tr><td colspan="5" class="muted">이번 달 기록이 없습니다</td></tr>';
  }
  async function clock(action) {
    const { error } = await sb.rpc('clock', { p_action: action, p_note: document.getElementById('clockNote').value });
    if (error) return toast(errMsg(error), true);
    document.getElementById('clockNote').value = '';
    toast(action === 'in' ? '출근했습니다. 오늘도 힘내세요!' : '퇴근했습니다. 수고하셨습니다!');
    loadClock(); if (admin) loadAllClock();
  }
  document.getElementById('inBtn').onclick = () => clock('in');
  document.getElementById('outBtn').onclick = () => clock('out');

  let allRows = [];
  async function loadAllClock() {
    const mon = document.getElementById('clockMonth').value;
    const [y, m] = mon.split('-').map(Number);
    const end = App.ymdLocal(new Date(y, m, 0));
    const { data } = await sb.from('attendance').select('*').gte('work_date', `${mon}-01`).lte('work_date', end).order('work_date');
    allRows = data || [];
    const active = Object.values(people).filter(p => p.active);
    document.getElementById('allClock').innerHTML = active.map(p => {
      const mine = allRows.filter(r => r.user_id === p.id && r.check_in);
      const late = mine.filter(r => { const t = new Date(r.check_in); return t.getHours() * 60 + t.getMinutes() > 9 * 60 + 10; }).length;
      const worked = mine.filter(r => r.check_out).map(r => (new Date(r.check_out) - new Date(r.check_in)) / 60000);
      const avg = worked.length ? Math.round(worked.reduce((a, b) => a + b, 0) / worked.length) : 0;
      const t = allRows.find(r => r.user_id === p.id && r.work_date === kst());
      return `<tr><td>${esc(p.name)}</td><td>${mine.length}일</td><td>${late ? `<b class="due-late">${late}회</b>` : '0'}</td>
        <td>${avg ? `${Math.floor(avg / 60)}시간 ${avg % 60}분` : '-'}</td>
        <td>${t && t.check_in ? `${hm(t.check_in)}${t.check_out ? ' ~ ' + hm(t.check_out) : ' 근무 중'}` : '<span class="muted">-</span>'}</td></tr>`;
    }).join('');
  }
  if (admin) {
    document.getElementById('adminClock').hidden = false;
    document.getElementById('clockMonth').value = kst().slice(0, 7);
    document.getElementById('clockMonth').onchange = loadAllClock;
    document.getElementById('csvBtn').onclick = () => {
      const lines = [['이름', '날짜', '출근', '퇴근', '근무(분)', '메모']].concat(allRows.map(r => [nameOf(r.user_id), r.work_date, hm(r.check_in), hm(r.check_out),
        r.check_in && r.check_out ? Math.round((new Date(r.check_out) - new Date(r.check_in)) / 60000) : '', (r.note || '').replace(/"/g, '""')]));
      const csv = '﻿' + lines.map(l => l.map(v => `"${v}"`).join(',')).join('\r\n');
      App.saveFile(new Blob([csv], { type: 'text/csv' }), `attendance_${document.getElementById("clockMonth").value}.csv`);
      App.logActivity('export', 'attendance', document.getElementById('clockMonth').value, 'CSV');
    };
    loadAllClock();
  }
  loadClock();

  // ===== 휴가·외근 =====
  const STATUS = { pending: '<span class="badge pending">대기</span>', approved: '<span class="badge approved">승인</span>', rejected: '<span class="badge rejected">반려</span>', cancelled: '<span class="badge none">취소</span>' };
  const range = (r) => md(r.start_date) + (r.end_date !== r.start_date ? ` ~ ${md(r.end_date)}` : '');
  const apSel = document.getElementById('lApprover');
  const cands = Object.values(people).filter(p => p.active && p.id !== me.id).sort((a, b) => (b.role === 'admin') - (a.role === 'admin'));
  apSel.innerHTML = cands.map(p => `<option value="${p.id}">${esc(p.name)}${p.role === 'admin' ? ' (관리자)' : ''}</option>`).join('');
  document.getElementById('lStart').value = document.getElementById('lEnd').value = kst();
  document.getElementById('lStart').onchange = (e) => { const end = document.getElementById('lEnd'); if (end.value < e.target.value) end.value = e.target.value; };
  document.getElementById('leaveForm').onsubmit = async (e) => {
    e.preventDefault();
    const { error } = await sb.rpc('request_leave', { p_kind: document.getElementById('lKind').value, p_start: document.getElementById('lStart').value,
      p_end: document.getElementById('lEnd').value, p_reason: document.getElementById('lReason').value, p_approver: apSel.value });
    if (error) return toast(errMsg(error), true);
    App.sendMail(e.target.querySelector('[type=submit]'), { label: `📮 ${App.honor(apSel.value)}께 전달` });
    toast(`${App.honor(apSel.value)}께 승인 요청을 보냈습니다.`);
    document.getElementById('lReason').value = '';
    loadLeaves();
  };
  async function loadLeaves() {
    const { data } = await sb.from('leave_requests').select('*').order('start_date', { ascending: false }).limit(300);
    const all = data || [];
    const toMe = all.filter(r => r.status === 'pending' && (r.approver_id === me.id || (admin && r.user_id !== me.id)));
    document.getElementById('toApproveCard').hidden = !toMe.length;
    document.getElementById('toApproveCount').textContent = toMe.length ? `${toMe.length}건` : '';
    document.getElementById('leaveBadge').textContent = toMe.length ? `(${toMe.length})` : '';
    document.getElementById('toApprove').innerHTML = toMe.map(r => `<li data-id="${r.id}">
      <span><b>${esc(nameOf(r.user_id))}</b> ${esc(r.kind)} · ${range(r)}${r.reason ? ` · <span class="muted">${esc(r.reason)}</span>` : ''}</span>
      <span class="btn-row" style="margin:0"><button class="btn ok sm" data-act="approved">승인</button><button class="btn bad sm" data-act="rejected">반려</button></span></li>`).join('');
    const mine = all.filter(r => r.user_id === me.id);
    document.getElementById('myLeaves').innerHTML = mine.length ? mine.map(r => `<li data-id="${r.id}">
      <span>${esc(r.kind)} · ${range(r)} ${STATUS[r.status]} <span class="muted">승인자 ${esc(nameOf(r.approver_id))}${r.comment ? ` · "${esc(r.comment)}"` : ''}</span></span>
      ${r.status === 'pending' || (r.status === 'approved' && r.start_date > kst()) ? '<button class="btn ghost sm" data-act="cancelled">취소</button>' : ''}</li>`).join('')
      : '<li class="muted">신청 내역이 없습니다</li>';
    const up = all.filter(r => r.status === 'approved' && r.end_date >= kst()).sort((a, b) => a.start_date.localeCompare(b.start_date));
    document.getElementById('upcoming').innerHTML = up.length ? up.map(r => `<li><span>🌴 <b>${esc(nameOf(r.user_id))}</b> ${esc(r.kind)}</span><span class="when">${range(r)}</span></li>`).join('')
      : '<li class="muted">예정된 휴가·외근이 없습니다</li>';
  }
  document.querySelector('[data-pane="leave"]').onclick = async (e) => {
    const b = e.target.closest('button[data-act]');
    if (!b) return;
    const id = b.closest('li').dataset.id, act = b.dataset.act;
    let comment = null;
    if (act === 'rejected') { comment = prompt('반려 사유를 적어 주세요'); if (comment === null) return; }
    if (act === 'cancelled' && !confirm('이 신청을 취소할까요?')) return;
    const { error } = await sb.rpc('decide_leave', { p_id: id, p_decision: act, p_comment: comment });
    if (error) return toast(errMsg(error), true);
    toast({ approved: '승인했습니다.', rejected: '반려했습니다.', cancelled: '취소했습니다.' }[act]);
    loadLeaves();
  };
  loadLeaves();

  // ===== 예약 =====
  let resources = [];
  const resSel = document.getElementById('bResource');
  document.getElementById('bDate').value = kst();
  async function loadResources() {
    const { data } = await sb.from('resources').select('*').order('name');
    resources = (data || []).filter(r => r.active);
    const keep = resSel.value;
    resSel.innerHTML = resources.map(r => `<option value="${r.id}">${r.kind === 'car' ? '🚗' : r.kind === 'room' ? '🏢' : '📦'} ${esc(r.name)}</option>`).join('');
    if (keep && resources.some(r => r.id === keep)) resSel.value = keep;
    if (admin) document.getElementById('resList').innerHTML = (data || []).map(r => `<li><span>${esc(r.name)}${r.active ? '' : ' <span class="muted">(사용 안 함)</span>'}</span>
      <button class="btn ghost sm" data-res="${r.id}" data-on="${r.active ? 0 : 1}">${r.active ? '사용 안 함' : '다시 사용'}</button></li>`).join('');
  }
  async function loadBookings() {
    if (!resSel.value) { document.getElementById('bookDay').innerHTML = '<p class="muted">예약 대상이 없습니다.</p>'; return; }
    const day = document.getElementById('bDate').value;
    const from = new Date(day + 'T00:00:00'), to = new Date(from); to.setDate(to.getDate() + 1);
    const { data } = await sb.from('bookings').select('*').eq('resource_id', resSel.value).lt('starts_at', to.toISOString()).gt('ends_at', from.toISOString()).order('starts_at');
    const list = data || [];
    document.getElementById('bookDay').innerHTML = list.length ? list.map(b => `<div class="book-item${b.user_id === me.id ? ' mine' : ''}">
      <b>${hm(b.starts_at)} ~ ${hm(b.ends_at)}</b> ${esc(b.title)} <span class="muted">${esc(nameOf(b.user_id))}</span>
      ${b.user_id === me.id || admin ? `<button class="btn ghost sm" data-del="${b.id}">취소</button>` : ''}</div>`).join('')
      : '<p class="muted">이 날은 예약이 없습니다. 아래에서 바로 예약하세요.</p>';
  }
  resSel.onchange = loadBookings;
  document.getElementById('bDate').onchange = loadBookings;
  document.getElementById('bookDay').onclick = async (e) => {
    const b = e.target.closest('[data-del]');
    if (!b || !confirm('예약을 취소할까요?')) return;
    const { error } = await sb.from('bookings').delete().eq('id', b.dataset.del);
    if (error) return toast(errMsg(error), true);
    loadBookings();
  };
  document.getElementById('bookForm').onsubmit = async (e) => {
    e.preventDefault();
    const day = document.getElementById('bDate').value;
    const s = new Date(`${day}T${document.getElementById('bStart').value}`), en = new Date(`${day}T${document.getElementById('bEnd').value}`);
    if (en <= s) return toast('끝나는 시간이 시작보다 늦어야 합니다.', true);
    const { error } = await sb.from('bookings').insert({ resource_id: resSel.value, user_id: me.id, title: document.getElementById('bTitle').value.trim(), starts_at: s.toISOString(), ends_at: en.toISOString() });
    if (error) return toast(errMsg(error), true);
    toast('예약했습니다.');
    document.getElementById('bTitle').value = '';
    loadBookings();
  };
  if (admin) {
    document.getElementById('resAdmin').hidden = false;
    document.getElementById('resAdd').onclick = async () => {
      const name = document.getElementById('resName').value.trim();
      if (!name) return;
      const { error } = await sb.from('resources').insert({ name, kind: document.getElementById('resKind').value });
      if (error) return toast(errMsg(error), true);
      document.getElementById('resName').value = '';
      await loadResources(); loadBookings();
    };
    document.getElementById('resList').onclick = async (e) => {
      const b = e.target.closest('[data-res]');
      if (!b) return;
      const { error } = await sb.from('resources').update({ active: b.dataset.on === '1' }).eq('id', b.dataset.res);
      if (error) return toast(errMsg(error), true);
      await loadResources(); loadBookings();
    };
  }
  await loadResources();
  loadBookings();
})().catch(e => console.warn(e.message));
</script>
</body>
</html>
