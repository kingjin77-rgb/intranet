<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>로그인 · 사내 인트라넷</title>
<meta property="og:title" content="사내 인트라넷">
<meta property="og:description" content="제안서·자료 공유, 열람확인, 코멘트, 컨펌">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1a4f8a">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="인트라넷">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="style.css?v=3.0.0">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.3/dist/umd/supabase.js"></script>
<script src="config.js?v=3.0.0"></script>
<script src="app.js?v=3.0.0"></script>
</head>
<body>
<main class="center-wrap">
  <div class="card login-card">
    <div class="page-title">📁 <span id="company"></span> 인트라넷</div>
    <div class="tabs" id="loginTabs" style="margin:12px 0 0">
      <button class="tab active" type="button" data-tab="pw">🔑 비밀번호</button>
      <button class="tab" type="button" data-tab="code">✉️ 이메일 코드</button>
    </div>

    <form id="pwForm">
      <label for="pwEmail">이메일</label>
      <input type="email" id="pwEmail" required autocomplete="username" placeholder="name@company.com">
      <label for="pw">비밀번호</label>
      <input type="password" id="pw" required autocomplete="current-password">
      <div class="btn-row"><button class="btn" type="submit" style="width:100%">로그인</button></div>
      <p class="muted" style="margin-top:10px">처음이거나 비밀번호를 잊었다면 <a href="#" id="toCode">✉️ 이메일 코드</a>로 로그인한 뒤 비밀번호를 정하세요.</p>
    </form>

    <form id="emailForm" hidden>
      <p class="muted" style="margin-top:12px">메일로 받은 6자리 코드로 로그인합니다. 처음 로그인할 때 쓰세요.</p>
      <label for="email">이메일</label>
      <input type="email" id="email" required autocomplete="email" placeholder="name@company.com">
      <div class="btn-row"><button class="btn" type="submit" style="width:100%">인증 코드 받기</button></div>
    </form>

    <form id="codeForm" hidden>
      <p class="muted" style="margin-top:12px"><b id="sentTo"></b> 으로 메일을 보냈습니다.<br>메일의 <b>6자리 코드</b>를 입력하거나, 메일의 링크를 누르세요.</p>
      <label for="code">인증 코드</label>
      <input type="text" id="code" inputmode="numeric" autocomplete="one-time-code" maxlength="10" placeholder="123456" required>
      <div class="btn-row">
        <button class="btn" type="submit" style="flex:1">로그인</button>
        <button class="btn ghost" type="button" id="backBtn">이메일 다시 입력</button>
      </div>
      <p class="notice">카카오톡 안에서 열었다면 메일 링크 대신 <b>코드 입력</b>을 사용하세요. (카톡 브라우저와 메일앱은 로그인이 공유되지 않습니다)</p>
    </form>
    <p class="muted" style="margin-top:14px;text-align:center"><a href="help.html">📲 PC·휴대폰에 설치하는 방법</a></p>
  </div>
</main>
<script>
(async () => {
  const { sb, cfg, toast, errMsg } = App;
  document.getElementById('company').textContent = cfg.COMPANY_NAME || '';
  if (!sb) {
    document.querySelector('.login-card').insertAdjacentHTML('beforeend',
      '<p class="notice">config.js 에 Supabase 설정을 먼저 입력하세요.</p>');
    return;
  }

  const params = new URLSearchParams(location.search);
  const next = params.get('next') || '';
  // 다른 사이트로 튕기지 않도록 같은 폴더의 html 페이지만 허용
  const safeNext = /^[a-z]+\.html(\?[\w=&%-]*)?$/.test(next) ? next : 'home.html';
  try { localStorage.setItem('intranet_next', safeNext); } catch {}

  const goNext = () => {
    let dest = safeNext;
    try { dest = localStorage.getItem('intranet_next') || safeNext; localStorage.removeItem('intranet_next'); } catch {}
    location.replace(dest);
  };

  // 메일 링크로 돌아온 경우 supabase-js 가 URL 의 토큰으로 세션을 만든다
  const { data: { session } } = await sb.auth.getSession();
  if (session) return goNext();
  sb.auth.onAuthStateChange((event, s) => { if (s) goNext(); });

  const pwForm = document.getElementById('pwForm');
  const emailForm = document.getElementById('emailForm');
  const codeForm = document.getElementById('codeForm');
  let email = '';
  let lastEmail = '';
  try { lastEmail = localStorage.getItem('intranet_email') || ''; } catch {}
  document.getElementById('pwEmail').value = lastEmail;
  document.getElementById('email').value = lastEmail;
  const remember = (em) => { try { localStorage.setItem('intranet_email', em); } catch {} };

  function setTab(t) {
    document.querySelectorAll('#loginTabs .tab').forEach(b => b.classList.toggle('active', b.dataset.tab === t));
    pwForm.hidden = t !== 'pw';
    emailForm.hidden = t !== 'code';
    codeForm.hidden = true;
  }
  document.getElementById('loginTabs').onclick = (e) => { const b = e.target.closest('[data-tab]'); if (b) setTab(b.dataset.tab); };
  document.getElementById('toCode').onclick = (e) => { e.preventDefault(); setTab('code'); };
  // 비밀번호를 한 번도 안 정한 기기에서는 이메일 코드 탭부터
  try { if (!localStorage.getItem('intranet_email')) setTab('code'); } catch {}

  pwForm.onsubmit = async (e) => {
    e.preventDefault();
    const em = document.getElementById('pwEmail').value.trim().toLowerCase();
    const btn = pwForm.querySelector('button[type=submit]');
    btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: em, password: document.getElementById('pw').value });
    btn.disabled = false;
    if (error) return toast(errMsg(error), true);
    remember(em);
    goNext();
  };

  emailForm.onsubmit = async (e) => {
    e.preventDefault();
    email = document.getElementById('email').value.trim().toLowerCase();
    const btn = emailForm.querySelector('button');
    btn.disabled = true;
    const { error } = await sb.auth.signInWithOtp({
      email,
      options: { shouldCreateUser: true, emailRedirectTo: App.pageUrl('login.html') },
    });
    btn.disabled = false;
    if (error) return toast(errMsg(error), true);
    document.getElementById('sentTo').textContent = email;
    emailForm.hidden = true;
    codeForm.hidden = false;
    document.getElementById('code').focus();
  };

  codeForm.onsubmit = async (e) => {
    e.preventDefault();
    const token = document.getElementById('code').value.trim();
    const btn = codeForm.querySelector('button[type=submit]');
    btn.disabled = true;
    const { error } = await sb.auth.verifyOtp({ email, token, type: 'email' });
    btn.disabled = false;
    if (error) return toast(errMsg(error), true);
    remember(email);
    // 다음 화면에서 비밀번호를 정하라고 한 번 권한다
    try { if (!localStorage.getItem('intranet_pw_prompted')) localStorage.setItem('intranet_pw_prompt', 'pending'); } catch {}
    goNext();
  };

  document.getElementById('backBtn').onclick = () => {
    codeForm.hidden = true;
    emailForm.hidden = false;
  };
})();
</script>
</body>
</html>
